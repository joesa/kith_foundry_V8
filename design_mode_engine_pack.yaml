composition_blueprints:
  Landing Page:
    default_pages:
      - "Home"
      - "Pricing"
      - "About"
      - "Contact"
    section_order:
      - "Hero"
      - "Social Proof"
      - "Features"
      - "Demo"
      - "Testimonials"
      - "Pricing"
      - "FAQ"
      - "CTA"
      - "Footer"
    responsive_rules:
      desktop: "wide hero, 3-column features, centered CTA"
      tablet: "stacked hero, 2-column features"
      mobile: "single-column blocks, compact nav drawer"
  SaaS Dashboard:
    default_pages:
      - "Dashboard"
      - "Analytics"
      - "Settings"
      - "Billing"
      - "Profile"
    section_order:
      - "Topbar"
      - "Metric Summary"
      - "Primary Work Area"
      - "Charts"
      - "Recent Activity"
      - "Quick Actions"
    responsive_rules:
      desktop: "sidebar + 3-column grid"
      tablet: "collapsed sidebar + 2-column grid"
      mobile: "bottom nav + stacked cards"
  Portfolio:
    default_pages:
      - "Home"
