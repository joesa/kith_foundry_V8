selection_logic:
  instructions:
    - "Classify the user request into the best product mode."
    - "Select a style mode based on audience, tone, and product maturity."
    - "Load the product mode blueprint and style modifiers."
    - "Resolve allowed patterns from the UI pattern library."
    - "Compose pages using priority-first hierarchy and avoid pattern noise."
    - "Generate components only from relevant patterns and reuse existing design tokens."