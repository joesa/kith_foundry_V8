server {
    listen 80 default_server;
    server_name _;

    # Route /api/v1/* to the Python bridge API on port 9999
    location /api/v1/ {
        proxy_pass http://127.0.0.1:9999;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Route everything else to the Vite dev server on port 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_intercept_errors on;
        error_page 502 503 504 @vite_loading;
    }

    location @vite_loading {
        default_type text/html;
        return 503 '<!doctype html><html><head><meta http-equiv="refresh" content="2"><title>Building...</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0e0e11;color:#888;display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui,sans-serif;flex-direction:column;gap:12px}.dot{width:8px;height:8px;border-radius:50%;background:#6366f1;display:inline-block;animation:pulse 1.2s ease-in-out infinite}.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}.dots{display:flex;gap:6px}</style></head><body><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><p>Building preview...</p></body></html>';
    }
}
