app = "kith-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  WORKERS = "4"
  ENVIRONMENT = "production"
  PGBOUNCER = "false"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  path = "/api/health"
  timeout = "5s"

[[vm]]
  size = "performance-2x"
  memory = "4096"

[scaling]
  min_count = 2
  max_count = 5
